name: "CodeQL Config"

# The SEI telemetry overlay feature intentionally displays vehicle telemetry
# data (including GPS coordinates) as a video overlay. Users explicitly opt-in
# to this feature via --sei_overlay flag. The "sensitive information" warnings
# are false positives for this use case - the feature's purpose IS to display
# this data as a video overlay.

paths-ignore:
  - '**/test_*.py'

query-filters:
  - exclude:
      id: py/clear-text-storage-sensitive-data
  - exclude:
      id: py/clear-text-logging-sensitive-data
